<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finish! · Upload Your Resume</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <!-- 左列：标题 + 说明 + 插画 -->
    <section class="hero" aria-labelledby="hero-title">
      <h1 class="hero-title" id="hero-title">
        <span class="hero-title-top">Finish!</span>
        <span class="hero-title-sub">Upload Your Resume</span>
      </h1>
      <p class="hero-desc">
        Almost there. Add your resume so employers can see your experience,
        skills and education at a glance. We accept PDF, DOC and DOCX files.
      </p>
      <!-- 原创内联 SVG 插画（蓝灰抽象：文档 + 上传箭头），非复制任何受限图片 -->
      <svg class="hero-illustration" viewBox="0 0 320 240" role="img"
           aria-label="Illustration of a document being uploaded to the cloud"
           xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="cloudGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#aebfce"/>
            <stop offset="1" stop-color="#7b8fa3"/>
          </linearGradient>
          <linearGradient id="docGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#eef3f7"/>
            <stop offset="1" stop-color="#d6e0e8"/>
          </linearGradient>
        </defs>
        <!-- 云朵 -->
        <g>
          <ellipse cx="150" cy="84" rx="62" ry="34" fill="url(#cloudGrad)"/>
          <ellipse cx="196" cy="96" rx="40" ry="24" fill="url(#cloudGrad)"/>
          <ellipse cx="104" cy="98" rx="38" ry="22" fill="url(#cloudGrad)"/>
        </g>
        <!-- 上传箭头 -->
        <g stroke="#5c7185" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <line x1="150" y1="168" x2="150" y2="104"/>
          <polyline points="122,130 150,102 178,130"/>
        </g>
        <!-- 文档 -->
        <g>
          <rect x="104" y="166" width="92" height="70" rx="8" fill="url(#docGrad)" stroke="#7b8fa3" stroke-width="3"/>
          <rect x="118" y="182" width="46" height="7" rx="3.5" fill="#9db0c0"/>
          <rect x="118" y="198" width="64" height="7" rx="3.5" fill="#9db0c0"/>
          <rect x="118" y="214" width="38" height="7" rx="3.5" fill="#9db0c0"/>
        </g>
        <!-- 装饰圆点 -->
        <circle cx="58" cy="196" r="6" fill="#c4d2dd"/>
        <circle cx="262" cy="60" r="5" fill="#dbe4eb"/>
        <circle cx="276" cy="176" r="8" fill="#e6edf2"/>
      </svg>
    </section>

    <!-- 右列：上传卡片 -->
    <section class="card" aria-labelledby="card-title">
      <h2 class="card-title" id="card-title">Upload file</h2>
      <p class="card-subtitle">Add a copy of your most recent resume.</p>

      <!-- 上传区：label 关联隐藏 file input，点击/键盘均可打开文件框 -->
      <label class="upload-area" id="upload-area" for="file-input">
        <input type="file" id="file-input" class="sr-only"
               accept=".pdf,.doc,.docx,application/pdf" />
        <svg class="cloud-icon" viewBox="0 0 48 48" aria-hidden="true"
             xmlns="http://www.w3.org/2000/svg">
          <path d="M12 36a8 8 0 1 1 1.6-15.8A11 11 0 0 1 34.7 24 7 7 0 0 1 35 36h-23z"
                fill="currentColor"/>
          <path d="M24 32V18M18 24l6-6 6 6" fill="none" stroke="#fff"
                stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p class="upload-prompt">
          <strong>Drag &amp; drop</strong> your file here, or
          <span class="browse">browse</span> to choose one.
        </p>
        <p class="upload-hint">PDF, DOC or DOCX · up to 5 MB</p>
      </label>

      <!-- 文件名 / 状态（可访问，aria-live 播报） -->
      <div class="file-status" id="file-status" role="status" aria-live="polite">
        <span id="file-name">No file selected</span>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-secondary" id="btn-back">Last step</button>
        <button type="button" class="btn btn-primary" id="btn-finish">Finish</button>
      </div>

      <!-- 三步进度线 -->
      <ol class="steps" aria-label="Upload progress: step 3 of 3">
        <li class="step step-done">
          <span class="step-dot" aria-hidden="true"></span>
          <span class="step-label">Personal</span>
        </li>
        <li class="step step-done">
          <span class="step-dot" aria-hidden="true"></span>
          <span class="step-label">Details</span>
        </li>
        <li class="step step-current">
          <span class="step-dot" aria-hidden="true"></span>
          <span class="step-label">Upload</span>
        </li>
      </ol>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
